<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 1. 告诉搜索引擎新网址，避免旧网址抢权重 -->
    <link rel="canonical" href="https://btcdage2011.github.io/">
    
    <!-- 2. 核心：0 秒后自动跳转到新网址 -->
    <meta http-equiv="refresh" content="0; url=https://btcdage2011.github.io/">
    
    <title>页面跳转中...</title>
    
    <!-- 3. JS 加速跳转，同时不污染浏览器的“返回”历史记录 -->
    <script>
        window.location.replace("https://btcdage2011.github.io/");
    </script>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; padding-top: 50px; background-color: #0b0e14; color: #ffffff;">
    <p>页面已迁移，正在为您跳转到主站...</p>
    <p>如果浏览器没有自动跳转，请<a href="https://btcdage2011.github.io/" style="color: #f7931a; text-decoration: underline;">点击这里直接访问</a>。</p>
</body>
</html>
